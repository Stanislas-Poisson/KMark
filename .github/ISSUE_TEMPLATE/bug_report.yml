name: Bug report
description: The tool gives a wrong result or fails.
labels: [bug]
body:
  - type: textarea
    id: input
    attributes:
      label: Input text
      description: The smallest text that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected HTML
      render: html
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual HTML
      render: html
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      description: For example 8.4.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Version or commit, operating system, and anything else that helps.
